<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://pjnvhdxytjxbaiwvlylj.supabase.co; base-uri 'none'; form-action 'self'">
<title>Verificar certificado · Yo Aprendo</title>
<style>
  :root{--tinta:#202124;--gris:#5f6368;--linea:#dadce0;--ok:#188038;--okbg:#e6f4ea;--mal:#c5221f;--malbg:#fce8e6;--ac:#1a73e8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#f8f9fa;color:var(--tinta);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:100%;max-width:480px;background:#fff;border:1px solid var(--linea);border-radius:16px;padding:28px 24px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .marca{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
  h1{font-size:22px;margin:6px 0 18px}
  .estado{border-radius:12px;padding:18px 14px;margin:0 0 14px}
  .estado.ok{background:var(--okbg);color:var(--ok)}
  .estado.mal{background:var(--malbg);color:var(--mal)}
  .estado .ico{font-size:40px;line-height:1}
  .estado strong{display:block;font-size:18px;margin-top:6px}
  dl{margin:0;text-align:left}
  dt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);margin-top:12px}
  dd{margin:2px 0 0;font-size:17px;font-weight:600;word-break:break-word}
  form{display:flex;gap:8px;margin-top:16px}
  input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;font:inherit;text-transform:uppercase;letter-spacing:.05em}
  button{padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .nota{font-size:13px;color:var(--gris);margin:16px 0 0}
</style>
</head>
<body>
<main>
  <div class="marca">Yo Aprendo</div>
  <h1>Verificar certificado</h1>
  <div id="res" role="status" aria-live="polite"></div>
  <form id="f" autocomplete="off">
    <input id="c" type="text" inputmode="text" maxlength="14" placeholder="YA-XXXXX-XXXXX" aria-label="Código del certificado">
    <button type="submit">Verificar</button>
  </form>
  <p class="nota">Cada certificado trae un código único y un QR. Aquí solo se muestran el nombre, el taller y la fecha.</p>
</main>
<script src="js/validar.js"></script>
</body>
</html>
